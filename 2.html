<html>
<head>
<title> student form </title>

</head>
<h1>STUDENT FORM</h1>
<body>
<form>

<table border="10">

<td>First Name</td>
<td><input type="text" id="fname" name="fname" ></td>
</tr>

<td>Middle Name</td>
<td><input type="text" id="mname" name="fname" ></td>
</tr>

<td>Last Name</td>
<td><input type="text" id="lname" name="fname" ></td>
</tr>

<tr>
 <td><label for="course">Chose the Course:</label></td>
<td>
<select id="course">
  <option>IMCA</option>
  <option>MCA</option>
  <option>BCA</option>
  <option>BCOM</option>
  <option>MCOM</option>
</select>
</td>
    </tr>
 <tr>
<td><label for="sem">Chose the Semseter:</label></td>
<td>
<select id="sem">
  <option>Semseter - 1</option>
  <option>Semseter - 2</option>
  <option>Semseter - 3</option>
  <option>Semseter - 4</option>
  <option>Semseter - 5</option>
  <option>Semseter - 6</option>
  <option>Semseter - 7</option>
  <option>Semseter - 8</option>
  <option>Semseter - 9</option>
  <option>Semseter - 10</option>

</select>
</td>
    </tr>

<tr>
<td align="center" colspan="2">
<input type="checkbox">
I agree to the terms and conditions
</td>
</tr>

<tr>
<td align="center">
<input type="submit" value="SUBMIT">
</td>

<td align="center">
<input type="reset" value="RESET">
</td>
</tr>

</table>

</form>

</body>
</html>
