<html>
<head>
    <title>Application Form</title>
<style>
body{
    background-color: rgb(255, 255, 255);
    font-family: Arial, sans-serif;
}
div{
    width: 600px;
    margin: 30px auto;
    padding: 20px;
    background-color: rgb(255, 245, 187);
    border: 1px solid rgb(0, 0, 0);
}
h1{
    text-align: center;
    color: rgb(0, 0, 0);
}
input[type="text"],
input[type="tel"]{
    width: 100%;
    padding: 5px;
    margin-bottom: 10px;
    box-sizing: border-box;
}
input[type="submit"],
input[type="reset"]{
    padding: 5px 20px;
    background-color: rgb(117, 109, 0);
    margin: 0 5px;
}
.button-container {
    text-align: center;
    width: auto;
    border: none;    
}



</style>
</head>
<body>
<div>

<form>

    <h1>Student Application Form</h1>

    <label for="fname">First Name:</label><br>
    <input type="text" id="fname" name="fname"><br>
    <label for="lname">Last Name:</label><br>
    <input type="text" id="lname" name="lname"><br>
    <label for="number">Phone Number:</label><br>
    <input type="tel" id="number" name="number">

    <p><b>Please select your gender:</b></p>

    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>

    <br><br>

    <p><b>Please select your course:</b></p>

    <input type="checkbox" id="c1" name="course" value="IMCA">
    <label for="c1">IMCA</label><br>
    <input type="checkbox" id="c2" name="course" value="BCA">
    <label for="c2">BCA</label><br>
    <input type="checkbox" id="c3" name="course" value="BCOM">
    <label for="c3">BCOM</label><br>

 <div class="button-container">
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</div>


</form>
</div>
</body>
</html>
